name: Publish GHCR
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["Dockerfile", "railway/**", ".github/workflows/publish-ghcr.yml"]
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: seanbabalala/SiftGate
          ref: v2.14.0
          path: upstream
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build upstream image (upstream Dockerfile, unmodified)
        run: docker build -t siftgate-upstream:v2.14.0 upstream
      - name: Build and push Railway image
        run: |
          docker build --build-arg BASE=siftgate-upstream:v2.14.0 -t ghcr.io/onepush-dev/siftgate:v2.14.0 .
          docker push ghcr.io/onepush-dev/siftgate:v2.14.0
